<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPM Detector</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; background:#0e0f12; color:#eee; font-family:-apple-system,system-ui,sans-serif; }
  #bpm { font-size:110px; font-weight:700; letter-spacing:-3px; }
  #label { opacity:.6; margin-top:-24px; letter-spacing:4px; font-size:14px; }
  #notes { display:flex; gap:20px 56px; justify-content:center; flex-wrap:wrap; }
  .nb { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:120px; }
  .nl { opacity:.6; letter-spacing:4px; font-size:14px; }
  .nv { font-size:72px; font-weight:700; letter-spacing:-2px; line-height:1; min-height:1em; }
  #now { color:#3ddc97; }
  .ns { opacity:.7; font-size:15px; min-height:1.2em; }
  #pulse { width:36px; height:36px; border-radius:50%; background:#3ddc97; opacity:.15; transition:opacity .08s; }
  #pulse.on { opacity:1; }
  canvas { width:min(640px,92vw); height:120px; background:#16181d; border-radius:12px; }
  #btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  #tap { background:transparent; color:#3ddc97; border:2px solid #3ddc97; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #mul { display:flex; gap:12px; }
  .small { background:transparent; color:#eee; border:1.5px solid #3a3f4a; padding:12px 18px; touch-action:manipulation; }
  .small:active { border-color:#3ddc97; }
  #tap:active { background:#3ddc97; color:#0e0f12; }
  button { background:#3ddc97; color:#0e0f12; border:0; border-radius:999px; padding:14px 34px; font-size:17px; font-weight:600; cursor:pointer; }
  #status { opacity:.55; font-size:14px; }
  #diag { opacity:.4; font-size:12px; font-variant-numeric:tabular-nums; }
  #kbwrap { width:min(640px,94vw); display:flex; flex-direction:column; gap:8px; align-items:center; }
  #kb { width:100%; height:auto; display:block; }
  .wk { fill:#e9eaee; stroke:#4a4f5a; stroke-width:1; }
  .wk.sc { fill:#aef0d5; } .wk.rt { fill:#ffb454; }
  .bk { fill:#1a1c21; stroke:#000; stroke-width:1; }
  .bk.sc { fill:#1f9e75; } .bk.rt { fill:#d98a1f; }
  .live { stroke:#5aa9ff !important; stroke-width:3.5 !important; }
  .nt { font-size:10px; text-anchor:middle; fill:#12141a; font-weight:600; pointer-events:none; }
  .nt.on-black { fill:#fff; }
  .fg { font-size:13px; text-anchor:middle; fill:#3ddc97; font-weight:700; }
  #heard { width:min(640px,94vw); display:flex; flex-direction:column; gap:8px; }
  #heardhead { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  #chips { display:flex; flex-wrap:wrap; gap:8px; min-height:38px; align-items:center; }
  #chipsempty { opacity:.5; font-size:14px; }
  .chip { background:#171a20; color:#eee; border:1.5px solid #3a3f4a; border-radius:999px; padding:8px 14px; font-size:16px; font-weight:600; cursor:pointer; touch-action:manipulation; }
  .chip.new { border-color:#3ddc97; color:#3ddc97; }
  .chip:focus-visible, .small:focus-visible, #mclose:focus-visible, #mplay:focus-visible { outline:3px solid #5aa9ff; outline-offset:2px; }
  .tiny { background:transparent; color:#eee; border:1.5px solid #3a3f4a; padding:6px 14px; font-size:13px; font-weight:500; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  #modal[hidden] { display:none; }
  #mcard { position:relative; background:#171a20; border:1px solid #2b303a; border-radius:18px; padding:22px 18px 18px; width:min(520px,100%); max-height:100%; overflow:auto; display:flex; flex-direction:column; gap:12px; align-items:stretch; }
  #mclose { position:absolute; top:10px; right:10px; background:transparent; color:#eee; border:1.5px solid #3a3f4a; border-radius:50%; width:36px; height:36px; padding:0; font-size:16px; }
  #mtitle { font-size:56px; font-weight:700; letter-spacing:-2px; line-height:1; color:#ffb454; }
  #msub { opacity:.75; font-size:15px; }
  #mkb { width:100%; height:auto; display:block; }
  #mhow { font-size:15px; line-height:1.5; }
  #mhow p { margin:0 0 8px; }
  #mplay { align-self:flex-start; }
  #scaleTxt { font-size:15px; opacity:.85; text-align:center; }
  #fingerTxt { font-size:13px; opacity:.6; text-align:center; max-width:46ch; }
</style>
</head>
<body>
  <div id="bpm">--</div>
  <div id="label">BPM</div>
  <div id="notes">
    <div class="nb"><div class="nl">ROOT NOTE</div><div class="nv" id="root">--</div><div class="ns" id="mode"></div></div>
    <div class="nb"><div class="nl">PLAYING NOW</div><div class="nv" id="now">--</div><div class="ns" id="nowhz"></div></div>
  </div>
  <div id="pulse"></div>
  <div id="kbwrap">
    <svg id="kb" viewBox="0 0 420 130" role="img" aria-label="Piano keyboard showing the scale of the detected key"></svg>
    <div id="scaleTxt"></div>
    <div id="fingerTxt"></div>
  </div>
  <div id="heard">
    <div id="heardhead"><div class="nl">NOTES HEARD <span id="heardn"></span></div><button id="clearNotes" class="tiny">Clear</button></div>
    <div id="chips"></div>
  </div>
  <canvas id="scope" width="1280" height="240"></canvas>
  <div id="btns"><button id="btn">Start listening</button><button id="tap">Tap tempo</button><span id="mul"><button id="half" class="small">÷2</button><button id="dbl" class="small">×2</button></span></div>
  <div id="status">Tap start and play a song near the mic.</div>
  <div id="diag"></div>

<div id="modal" hidden>
  <div id="mcard" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <button id="mclose" aria-label="Close">✕</button>
    <div id="mtitle"></div>
    <div id="msub"></div>
    <svg id="mkb" viewBox="0 0 420 118" role="img" aria-label="Piano keyboard with this note marked"></svg>
    <div id="mhow"></div>
    <button id="mplay">Hear it</button>
  </div>
</div>

<script>
const MIN_BPM = 70, MAX_BPM = 180;
const WINDOW_SEC = 8;           // analysis window
const HOP_MS = 500;             // re-estimate twice a second
const RECENCY_SEC = 3;          // newer beats count more; older ones fade out of the vote
const SAMPLE_MS = 10;           // fixed envelope sampling (100 Hz), independent of screen refresh
const FPS = 100;                // the tempo math runs on an even 100 frames per second
const MIN_LEVEL = 0.0004;       // only a dead or muted mic is below this; quiet music is fine
const MIN_CONF = 0.07;          // how clearly one tempo must stand out before it is shown (lower = picks up weaker beats; steady hiss scores about 0.03)
const MIN_REPEAT = 0.80;        // a real beat is still strong 3 beats later; random taps, clicks and speech fade (they score 0.76 or less)
const PITCH_ABOVE_NOISE_DB = 16;// a pitch must stand this far above the spectrum's own noise level

let ctx, analyser, analyserH = null, stream, running = false;
let envTimes = [], envVals = [], envLow = [], envHigh = [];  // loudness history: bass band and high band
let smoothBpm = null, pending = 0, timer = null, raf = null, sampler = null;

// ---- root note / key detection ----
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ROOT_MAJ = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];   // conventional key names
const ROOT_MIN = ['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
const MAJ = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];   // Krumhansl-Kessler key profiles
const MIN = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
const KEY_STEP_MS = 250;
const KEY_DECAY = Math.pow(0.5, KEY_STEP_MS / 8000);   // pitch memory fades with an 8 s half-life
const KEY_MIN_WEIGHT = 16;                              // about 5 s of music before the first answer
const KEY_FLOOR_DB = -105;                               // quieter than this is treated as no music
let analyser2 = null, freqBuf = null, keyTimer = null;
let chroma = new Float64Array(12), chromaWeight = 0;
let shownKey = -1, candKey = -1, candCount = 0;
const NOTE_FLOOR_DB = -105;
let nowCand = '', nowCount = 0, nowQuiet = 0;
const nowEl = document.getElementById('now');
const nowHzEl = document.getElementById('nowhz');
const rootEl = document.getElementById('root');
const modeEl = document.getElementById('mode');

const bpmEl = document.getElementById('bpm');
const statusEl = document.getElementById('status');
const pulse = document.getElementById('pulse');
const btn = document.getElementById('btn');
const scope = document.getElementById('scope');
const sctx = scope.getContext('2d');

btn.onclick = () => running ? stop() : start();

async function start() {
  // iPhone Safari only allows audio if it is started inside the tap, so create it before asking for the mic
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  try { ctx.resume(); } catch (e) {}
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
  } catch (e) {
    statusEl.textContent = 'Mic access denied or unavailable.';
    try { ctx.close(); } catch (e2) {}
    return;
  }
  try { await ctx.resume(); } catch (e) {}
  const src = ctx.createMediaStreamSource(stream);
  // low-pass so kick/bass drive the beat detection
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 150; lp.Q.value = 0.7;
  analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  src.connect(lp); lp.connect(analyser);
  // high band (hi-hats, snares, claps): phone speakers and mics carry these far better than bass
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 1500; hp.Q.value = 0.7;
  analyserH = ctx.createAnalyser();
  analyserH.fftSize = 1024;
  src.connect(hp); hp.connect(analyserH);

  envTimes = []; envVals = []; envLow = []; envHigh = []; smoothBpm = null; pending = 0; diagExtra = ''; failCount = 0; candBpm = 0; candStreak = 0; confAvg = null; repAvg = null; tempoMul = 1;
  running = true;
  btn.textContent = 'Stop';
  statusEl.textContent = 'Listening... tempo needs about 4 seconds, the key about 5.';
  sampler = setInterval(sample, SAMPLE_MS);
  loop();
  timer = setInterval(estimate, HOP_MS);

  // pitch features (root note, playing now, keyboard) are optional: if anything here fails, the tempo keeps working
  try {
    analyser2 = ctx.createAnalyser();
    analyser2.fftSize = 16384; analyser2.smoothingTimeConstant = 0.5; analyser2.minDecibels = -120;
    freqBuf = new Float32Array(analyser2.frequencyBinCount);
    src.connect(analyser2);
    resetKey();
    keyTimer = setInterval(keyStep, KEY_STEP_MS);
  } catch (e) {
    analyser2 = null; diagExtra = ' · pitch off: ' + (e && e.message ? e.message : e);
  }
}

function stop() {
  running = false;
  clearInterval(timer); clearInterval(sampler); clearInterval(keyTimer); clearInterval(pulseTimer); cancelAnimationFrame(raf);
  if (!tapActive()) { bpmEl.textContent = '--'; labelEl.textContent = 'BPM'; }
  resetKey();
  pulse.classList.remove('on');
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
  btn.textContent = 'Start listening';
  statusEl.textContent = 'Stopped.'; diagEl.textContent = '';
}

const buf = new Float32Array(1024);
let confAvg = null, repAvg = null;
let lastRms = 0, diagExtra = '', lastConf = 0, lastRep = 0, lastQual = null, failCount = 0, candBpm = 0, candStreak = 0;
const diagEl = document.getElementById('diag');
let lastBeatFlash = 0;

// audio sampling runs on a fixed timer so tempo math never depends on frame rate
const bufH = new Float32Array(1024);
function rmsOf(b) { let sum = 0; for (let i = 0; i < b.length; i++) sum += b[i] * b[i]; return Math.sqrt(sum / b.length); }
function sample() {
  if (!running) return;
  analyser.getFloatTimeDomainData(buf);
  const lo = rmsOf(buf);
  let hi = 0;
  if (analyserH) { analyserH.getFloatTimeDomainData(bufH); hi = rmsOf(bufH); }
  lastRms = lo;
  addSample(ctx.currentTime, lo, hi);
}
function addSample(t, lo, hi) {
  envTimes.push(t); envLow.push(lo); envHigh.push(hi); envVals.push(lo + hi);
  while (envTimes.length && t - envTimes[0] > WINDOW_SEC) { envTimes.shift(); envLow.shift(); envHigh.shift(); envVals.shift(); }
}

// drawing only; this can run at whatever rate the screen allows
function loop() {
  if (!running) return;
  draw();
  raf = requestAnimationFrame(loop);
}

function rhythmFail(msg) {
  statusEl.textContent = msg; candStreak = 0;
  if (++failCount >= 3) { smoothBpm = null; if (!tapActive()) { bpmEl.textContent = '--'; labelEl.textContent = 'BPM'; } clearInterval(pulseTimer); }   // keep the last answer for a moment, then clear
}

// loudness history -> evenly spaced frames
function resampleEnv(arr, tNow) {
  const t0 = envTimes[0], n = Math.floor((tNow - t0) * FPS), out = new Float32Array(Math.max(0, n));
  let j = 0;
  for (let i = 0; i < n; i++) {
    const t = t0 + i / FPS;
    while (j < envTimes.length - 2 && envTimes[j + 1] < t) j++;
    const a = envTimes[j], b = envTimes[j + 1], f = b > a ? Math.min(1, Math.max(0, (t - a) / (b - a))) : 0;
    out[i] = arr[j] + (arr[j + 1] - arr[j]) * f;
  }
  return out;
}
// how much louder each moment is than the one before, scaled so quiet and loud music look alike
function onsetOf(arr, tNow) {
  const x = resampleEnv(arr, tNow), n = x.length;
  const sorted = Array.from(x).sort((p, q) => p - q);
  const ref = sorted[Math.floor(n * 0.95)] + 1e-9;
  const l = new Float32Array(n);
  for (let i = 0; i < n; i++) l[i] = Math.log(x[i] / ref + 0.05);
  const o = new Float32Array(n);
  for (let i = 1; i < n; i++) o[i] = Math.max(0, l[i] - l[i - 1]);
  // remove the slow average (about 0.4 s) so only sudden rises count
  const w = Math.round(FPS * 0.4), cs = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) cs[i + 1] = cs[i] + o[i];
  const o2 = new Float32Array(n);
  for (let i = 0; i < n; i++) { const a = Math.max(0, i - w), b = Math.min(n, i + w + 1); o2[i] = Math.max(0, o[i] - (cs[b] - cs[a]) / (b - a)); }
  // light smoothing so a hit that falls between frames still lines up
  const o3 = new Float32Array(n), k = [1, 2, 3, 2, 1];
  for (let i = 0; i < n; i++) { let acc = 0; for (let j = -2; j <= 2; j++) { const m = i + j; if (m >= 0 && m < n) acc += o2[m] * k[j + 2]; } o3[i] = acc / 9; }
  let mean = 0; for (let i = 0; i < n; i++) mean += o3[i]; mean /= n;
  if (mean < 1e-9) return null;
  for (let i = 0; i < n; i++) o3[i] /= mean;
  return o3;
}
// find the tempo at which the onsets repeat most strongly, favouring the most recent seconds
function tempoFromEnvelopes(tNow) {
  const minLag = Math.floor(FPS * 60 / 200), maxLag = Math.ceil(FPS * 60 / 60);
  const bands = [onsetOf(envLow, tNow), onsetOf(envHigh, tNow)].filter(Boolean);
  if (!bands.length) return null;
  const n = bands[0].length;
  if (n < maxLag * 2 + 10) return null;
  const wts = new Float32Array(n);
  for (let i = 0; i < n; i++) wts[i] = Math.exp(-(n - i) / (RECENCY_SEC * FPS));
  const R = new Float64Array(maxLag * 3 + 3);
  for (const o of bands) {
    const r = new Float64Array(maxLag * 3 + 3);
    let r0 = 0, wsum = 0;
    for (let i = 0; i < n; i++) { r0 += wts[i] * o[i] * o[i]; wsum += wts[i]; }
    r0 = r0 / wsum + 1e-9;
    for (let L = minLag - 1; L <= maxLag * 3 + 1 && L < n * 0.75; L++) {
      let acc = 0, ws = 0;
      for (let i = 0; i + L < n; i++) { acc += wts[i] * o[i] * o[i + L]; ws += wts[i]; }
      r[L] = acc / ws / r0;
    }
    for (let L = 0; L < R.length; L++) R[L] += r[L];
  }
  let best = 0, bestScore = -1, sum = 0, cnt = 0;
  for (let L = minLag; L <= maxLag; L++) {
    const bpm = 60 * FPS / L;
    const prior = Math.exp(-0.5 * Math.pow(Math.log2(bpm / 120) / 0.9, 2));
    const sc = (R[L] + 0.5 * R[2 * L]) * (0.6 + 0.4 * prior);
    sum += sc; cnt++;
    if (sc > bestScore) { bestScore = sc; best = L; }
  }
  const y0 = R[best - 1], y1 = R[best], y2 = R[best + 1], d = y0 - 2 * y1 + y2;
  const shift = d !== 0 ? 0.5 * (y0 - y2) / d : 0;
  let bpm = 60 * FPS / (best + Math.max(-1, Math.min(1, shift)));
  while (bpm < MIN_BPM) bpm *= 2;
  while (bpm > MAX_BPM) bpm /= 2;
  const conf = Math.max(0, Math.min(1, (bestScore / (sum / cnt) - 1) / 6));
  const at = (m) => { const L = best * m; return L + 1 < R.length ? Math.max(R[L - 1], R[L], R[L + 1]) : 0; };
  const repeat = best * 3 < n * 0.75 && at(1) > 0 ? at(3) / at(1) : 1;   // too slow to measure 3 beats ahead: give the benefit of the doubt
  return { bpm, conf, repeat, r1: at(1), r2: at(2), r3: at(3), base: sum / cnt, lag: best };
}

function estimate() {
  diagEl.textContent = 'audio ' + ctx.state + ' · bass ' + lastRms.toFixed(4) + ' · readings ' + envTimes.length + ' · rhythm ' + lastConf.toFixed(2) + ' · steady ' + lastRep.toFixed(2) + diagExtra;
  if (ctx.state !== 'running') { statusEl.textContent = 'The browser paused audio. Tap Stop, then Start again.'; return; }
  if (envTimes.length < 100) return;
  const tNow = envTimes[envTimes.length - 1];
  const dur = tNow - envTimes[0];
  if (dur < 4) return;

  // only a dead or muted mic counts as silence; quiet music is still analysed
  let pk = 0;
  for (const v of envVals) if (v > pk) pk = v;
  if (pk < MIN_LEVEL) {
    smoothBpm = null; lastConf = 0; confAvg = null; repAvg = null;
    if (!tapActive()) { bpmEl.textContent = '--'; labelEl.textContent = 'BPM'; }
    clearInterval(pulseTimer);
    statusEl.textContent = 'Nothing heard. Check that the mic is on, or turn the music up.';
    return;
  }

  const r = tempoFromEnvelopes(tNow);
  lastConf = r ? r.conf : 0; lastQual = r;
  // judge on a running average over the last couple of seconds: music scores steadily, noise bounces around
  if (r) { confAvg = confAvg === null ? r.conf : 0.7 * confAvg + 0.3 * r.conf; repAvg = repAvg === null ? r.repeat : 0.7 * repAvg + 0.3 * r.repeat; }
  lastRep = repAvg === null ? 0 : repAvg;
  if (!r || confAvg < MIN_CONF) return rhythmFail('Not hearing a steady beat yet. Tap tempo works too.');
  if (repAvg < MIN_REPEAT) return rhythmFail('Sound is there but the beat is not steady. Tap tempo works too.');
  failCount = 0;
  const best = r.bpm;

  // before the first answer, the same tempo must come up 3 times running: real music repeats itself, random noise does not
  if (smoothBpm === null) {
    if (candBpm && Math.abs(best - candBpm) / candBpm < 0.04) candStreak++; else { candBpm = best; candStreak = 1; }
    if (candStreak < 3) { statusEl.textContent = 'Hearing something rhythmic, confirming...'; return; }
  }

  // follow small drift smoothly; jump when a clearly different tempo shows up twice in a row
  if (smoothBpm === null) { smoothBpm = best; pending = 0; }
  else if (Math.abs(best - smoothBpm) / smoothBpm > 0.06) {
    pending++;
    if (pending >= 2) { smoothBpm = best; pending = 0; }
  } else { pending = 0; smoothBpm = smoothBpm * 0.5 + best * 0.5; }
  if (!tapActive()) {
    bpmEl.textContent = Math.round(smoothBpm * tempoMul); labelEl.textContent = 'BPM';
    flash(60 / (smoothBpm * tempoMul));
    statusEl.textContent = 'Locked on. Rhythm strength ' + Math.round(r.conf * 100) + '%';
  }
}

// ---- tap tempo: works with or without the mic ----
let tempoMul = 1;   // set by the ÷2 / ×2 buttons when the detector locks on to half or double the tempo you feel
let taps = [], tapUntil = 0;
const tapBtn = document.getElementById('tap');
const labelEl = document.getElementById('label');
function tapActive() { return performance.now() < tapUntil; }
function doTap() {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2500) taps = [];   // a long pause starts a new count
  taps.push(now);
  if (taps.length > 8) taps.shift();
  if (taps.length < 2) { statusEl.textContent = 'Tap again on the next beat...'; return; }
  const bpm = 60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1));
  bpmEl.textContent = Math.round(bpm); labelEl.textContent = 'BPM · TAP';
  tapUntil = now + 8000;
  statusEl.textContent = 'Tap tempo from ' + taps.length + ' taps. Keep tapping with the beat.';
  flash(60 / bpm);
}
function applyMul(f) {
  if (smoothBpm === null || tapActive()) return;
  const next = smoothBpm * tempoMul * f;
  if (next < 30 || next > 300) return;
  tempoMul *= f;
  bpmEl.textContent = Math.round(smoothBpm * tempoMul); flash(60 / (smoothBpm * tempoMul));
}
document.getElementById('half').addEventListener('click', () => applyMul(0.5));
document.getElementById('dbl').addEventListener('click', () => applyMul(2));
tapBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); doTap(); });
tapBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doTap(); } });

function resetKey() {
  chroma = new Float64Array(12); chromaWeight = 0; shownKey = -1; candKey = -1; candCount = 0;
  rootEl.textContent = '--'; modeEl.textContent = '';
  if (typeof renderScale === 'function') { renderScale(-1); setLive(-1); }
  nowCand = ''; nowCount = 0; nowQuiet = 0; nowEl.textContent = '--'; nowHzEl.textContent = '';
}

// mains hum (50/60 Hz and its low harmonics) is a steady tone that is not music, so those exact frequencies are skipped
function isHum(f) {
  if (f > 300) return false;   // hum is strongest at low multiples; above this a notch would start erasing real notes (F4 is under 1 Hz from 350)
  for (const base of [50, 60]) { const m = Math.round(f / base); if (m >= 1 && Math.abs(f - m * base) < 1.3) return true; }
  return false;
}

// strongest pitch in the current spectrum; if its octave-below partner is also present, report that instead
function nowStep(floorAt) {
  const binHz = ctx.sampleRate / analyser2.fftSize;
  const lo = Math.ceil(80 / binHz), hi = Math.floor(1500 / binHz);
  let bk = -1, bd = -Infinity;
  for (let k = lo; k <= hi; k++) {
    const b = freqBuf[k];
    if (Number.isFinite(b) && b > bd && b > freqBuf[k-1] && b >= freqBuf[k+1] && b >= floorAt(k) + PITCH_ABOVE_NOISE_DB + 4 && !isHum(k * binHz)) { bd = b; bk = k; }
  }
  if (bk < 0 || bd < NOTE_FLOOR_DB) {
    if (++nowQuiet >= 4) { nowCand = ''; nowCount = 0; nowEl.textContent = '--'; nowHzEl.textContent = ''; setLive(-1); }
    return;
  }
  nowQuiet = 0;
  const refine = (k) => { const a = freqBuf[k-1], b = freqBuf[k], c = freqBuf[k+1], d = a - 2*b + c; return (k + (d !== 0 ? 0.5 * (a - c) / d : 0)) * binHz; };
  let f0 = refine(bk);
  for (let pass = 0; pass < 2; pass++) {
    const kk = Math.round(f0 / 2 / binHz);
    if (f0 / 2 < 70 || kk < 3) break;
    let mk = -1, md = -Infinity;
    for (let k = kk - 2; k <= kk + 2; k++) if (freqBuf[k] > md && freqBuf[k] > freqBuf[k-1] && freqBuf[k] >= freqBuf[k+1]) { md = freqBuf[k]; mk = k; }
    if (mk > 0 && md >= bd - 8 && md >= floorAt(mk) + PITCH_ABOVE_NOISE_DB) f0 = refine(mk); else break;
  }
  const r = Math.round(69 + 12 * Math.log2(f0 / 440));
  const name = NOTES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1);
  if (name === nowCand) nowCount++; else { nowCand = name; nowCount = 1; }
  if (nowCount >= 2) { nowEl.textContent = name; nowHzEl.textContent = Math.round(f0) + ' Hz'; setLive(r); }
}

// one slice of pitch content: find spectral peaks, fold them into 12 note classes
function keyStep() {
  try { keyStepInner(); } catch (e) { diagExtra = ' · pitch error: ' + (e && e.message ? e.message : e); }
}
function keyStepInner() {
  if (!running || !analyser2) return;
  analyser2.getFloatFrequencyData(freqBuf);
  const binHz = ctx.sampleRate / analyser2.fftSize;
  const lo = Math.max(2, Math.ceil(70 / binHz)), hi = Math.floor(2200 / binHz);
  const frame = new Float64Array(12);
  let sum = 0, maxDb = -Infinity, peakCount = 0;
  const peaks = [];
  // the spectrum's own noise level around each frequency (average in dB over about +/-130 Hz): tones stand far above it, hiss and rumble do not
  const nb = freqBuf.length, pre = new Float64Array(nb + 1);
  for (let k = 0; k < nb; k++) pre[k + 1] = pre[k] + (Number.isFinite(freqBuf[k]) ? freqBuf[k] : -140);
  const floorAt = (k) => { const a0 = Math.max(0, k - 48), b0 = Math.min(nb - 1, k + 48); return (pre[b0 + 1] - pre[a0]) / (b0 - a0 + 1); };
  nowStep(floorAt);
  for (let k = lo; k <= hi; k++) {
    const b = freqBuf[k];
    if (!Number.isFinite(b)) continue;
    if (b > maxDb) maxDb = b;
    const a = freqBuf[k-1], c = freqBuf[k+1];
    if (b < KEY_FLOOR_DB || b < floorAt(k) + PITCH_ABOVE_NOISE_DB || !(b > a) || !(b >= c)) continue;
    const den = a - 2*b + c;
    const delta = den !== 0 ? 0.5 * (a - c) / den : 0;       // refine the peak between bins
    if (isHum((k + delta) * binHz)) continue;
    const midi = 69 + 12 * Math.log2(((k + delta) * binHz) / 440);
    const r = Math.round(midi);
    if (Math.abs(midi - r) > 0.35) continue;                  // between notes, ignore
    const m = Math.pow(10, b / 20);
    frame[((r % 12) + 12) % 12] += m; sum += m; peakCount++;
    peaks.push({ f: (k + delta) * binHz, b, r });
  }
  diagExtra = ' · loudest pitch ' + (Number.isFinite(maxDb) ? Math.round(maxDb) + ' dB' : 'none');
  if (peakCount < 3 || sum === 0) { noteStreak = new Map(); return; }   // only noise this slice: keep what we had
  noteStep(peaks);
  for (let i = 0; i < 12; i++) chroma[i] = chroma[i] * KEY_DECAY + frame[i] / sum;
  chromaWeight = chromaWeight * KEY_DECAY + 1;
  if (chromaWeight < KEY_MIN_WEIGHT) { modeEl.textContent = 'Listening for the key...'; return; }

  // correlate against all 24 major and minor keys
  const scores = [];
  for (let m = 0; m < 2; m++) {
    const prof = m ? MIN : MAJ;
    for (let r = 0; r < 12; r++) {
      let mx = 0, my = 0;
      for (let i = 0; i < 12; i++) { mx += chroma[i]; my += prof[i]; }
      mx /= 12; my /= 12;
      let sxy = 0, sxx = 0, syy = 0;
      for (let i = 0; i < 12; i++) {
        const x = chroma[(i + r) % 12] - mx, y = prof[i] - my;
        sxy += x * y; sxx += x * x; syy += y * y;
      }
      scores.push({ id: m * 12 + r, s: sxy / Math.sqrt(sxx * syy + 1e-12) });
    }
  }
  scores.sort((p, q) => q.s - p.s);
  const best = scores[0], margin = best.s - scores[1].s;
  // only switch the display after the same answer shows up 3 times in a row
  if (best.id === candKey) candCount++; else { candKey = best.id; candCount = 1; }
  const prevShown = shownKey;
  if (shownKey < 0 || (candKey !== shownKey && candCount >= 3)) shownKey = candKey;
  if (shownKey !== prevShown) renderScale(shownKey);
  const shownScore = scores.find(x => x.id === shownKey);
  const conf = shownKey === best.id ? (margin > 0.08 ? 'strong' : margin > 0.03 ? 'moderate' : 'weak') : 'weak';
  rootEl.textContent = (shownKey >= 12 ? ROOT_MIN : ROOT_MAJ)[shownKey % 12];
  modeEl.textContent = (shownKey >= 12 ? 'minor' : 'major') + ' key · ' + conf;
}

// ---- keyboard: C3 to C5, scale keys lit, root marked, live note ringed ----
const KB_LOW = 48, KB_HIGH = 72, WK_W = 28, KB_TOP = 26;
const WHITE_PC = [0, 2, 4, 5, 7, 9, 11];
const kb = document.getElementById('kb');
const scaleTxt = document.getElementById('scaleTxt');
const fingerTxt = document.getElementById('fingerTxt');
const keyEls = {}, noteEls = {}, fingerEls = {};
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function buildKeyboard() {
  let wi = 0; const blacks = [];
  for (let m = KB_LOW; m <= KB_HIGH; m++) {
    const pc = m % 12;
    if (WHITE_PC.includes(pc)) {
      const x = wi * WK_W;
      const r = svgEl('rect', { x, y: KB_TOP, width: WK_W, height: 100, rx: 3, class: 'wk' });
      kb.appendChild(r); keyEls[m] = r;
      const t = svgEl('text', { x: x + WK_W / 2, y: KB_TOP + 92, class: 'nt' }, '');
      kb.appendChild(t); noteEls[m] = t;
      fingerEls[m] = { x: x + WK_W / 2 };
      wi++;
    } else blacks.push({ m, x: wi * WK_W });
  }
  for (const b of blacks) {
    const r = svgEl('rect', { x: b.x - 9, y: KB_TOP, width: 18, height: 62, rx: 2, class: 'bk' });
    kb.appendChild(r); keyEls[b.m] = r;
    const t = svgEl('text', { x: b.x, y: KB_TOP + 52, class: 'nt on-black' }, '');
    kb.appendChild(t); noteEls[b.m] = t;
    fingerEls[b.m] = { x: b.x };
  }
}
// standard right-hand fingerings for one octave, only for keys where the pattern is well established
const FING_A = [1,2,3,1,2,3,4,5], FING_F = [1,2,3,4,1,2,3,4];
const FINGERING = {
  major: { 0: FING_A, 7: FING_A, 2: FING_A, 9: FING_A, 4: FING_A, 11: FING_A, 5: FING_F },
  minor: { 9: FING_A, 4: FING_A, 11: FING_A, 2: FING_A, 7: FING_A, 0: FING_A, 5: FING_F }
};
const MAJ_STEPS = [0, 2, 4, 5, 7, 9, 11], MIN_STEPS = [0, 2, 3, 5, 7, 8, 10];
const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'], LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
function spellScale(rootName, steps, rootPc) {
  const li = LETTERS.indexOf(rootName[0]);
  return steps.map((st, i) => {
    const L = (li + i) % 7, pc = (rootPc + st) % 12;
    const d = ((pc - LETTER_PC[L] + 18) % 12) - 6;
    return LETTERS[L] + (d > 0 ? '#'.repeat(d) : d < 0 ? 'b'.repeat(-d) : '');
  });
}
let fingerNodes = [];
function renderScale(keyId) { renderScaleCore(keyId); applyLive(); }
function renderScaleCore(keyId) {
  fingerNodes.forEach(n => n.remove()); fingerNodes = [];
  for (const m in keyEls) {
    keyEls[m].setAttribute('class', (WHITE_PC.includes(m % 12) ? 'wk' : 'bk'));
    noteEls[m].textContent = '';
  }
  if (keyId < 0) { scaleTxt.textContent = 'Play a song and the keys of its scale will light up here.'; fingerTxt.textContent = ''; return; }
  const minor = keyId >= 12, rootPc = keyId % 12;
  const name = (minor ? ROOT_MIN : ROOT_MAJ)[rootPc];
  const steps = minor ? MIN_STEPS : MAJ_STEPS;
  const names = spellScale(name, steps, rootPc);
  const inScale = new Map(steps.map((st, i) => [(rootPc + st) % 12, names[i]]));
  for (const m in keyEls) {
    const pc = m % 12, base = WHITE_PC.includes(pc) ? 'wk' : 'bk';
    if (inScale.has(pc)) {
      keyEls[m].setAttribute('class', base + (pc === rootPc ? ' rt' : ' sc'));
      noteEls[m].textContent = inScale.get(pc);
    }
  }
  scaleTxt.textContent = name + (minor ? ' minor' : ' major') + ' scale: ' + names.join(' ') + ' ' + names[0];
  const fing = FINGERING[minor ? 'minor' : 'major'][rootPc];
  if (!fing) { fingerTxt.textContent = 'Finger numbers are not shown for this key. Play the lit keys.'; return; }
  // first run: lowest root in range, up one octave through the scale
  let m = KB_LOW + rootPc;
  const run = [m]; for (let i = 1; i < steps.length; i++) run.push(KB_LOW + rootPc + steps[i]); run.push(m + 12);
  run.forEach((note, i) => {
    const f = svgEl('text', { x: fingerEls[note].x, y: 17, class: 'fg' }, String(fing[i]));
    kb.appendChild(f); fingerNodes.push(f);
  });
  fingerTxt.textContent = 'Right hand, one octave up from the lowest ' + name + ': ' + fing.join(' ') + '. Green numbers are finger numbers (1 = thumb).';
}
var liveMidi = -1;
function applyLive() {
  for (const m in keyEls) keyEls[m].classList.remove('live');
  if (liveMidi < 0) return;
  const pc = ((liveMidi % 12) + 12) % 12;
  for (const m in keyEls) if (m % 12 === pc) keyEls[m].classList.add('live');
}
function setLive(midiNote) {
  if (liveMidi === midiNote) return;
  liveMidi = midiNote; applyLive();
}
try { buildKeyboard(); } catch (e) { diagExtra = ' · keyboard error: ' + e.message; }

// ---- notes heard: every distinct note (pitch + octave) once, newest highlighted ----
const heard = new Set();
let noteStreak = new Map();
const NOTES_STORE = 'bpmDetectorNotes';
const chipsEl = document.getElementById('chips'), heardN = document.getElementById('heardn');
function noteName(m) { return NOTES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); }
function noteHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function saveHeard() { try { localStorage.setItem(NOTES_STORE, JSON.stringify(Array.from(heard))); } catch (e) {} }
let newestChip = -1;
function renderChips() {
  chipsEl.textContent = '';
  const list = Array.from(heard).sort((a, b) => a - b);
  heardN.textContent = list.length ? '· ' + list.length : '';
  if (!list.length) {
    const e = document.createElement('span'); e.id = 'chipsempty'; e.textContent = 'Notes you play or that are in the song will collect here, each one once.'; chipsEl.appendChild(e); return;
  }
  for (const m of list) {
    const b = document.createElement('button');
    b.className = 'chip' + (m === newestChip ? ' new' : ''); b.textContent = noteName(m);
    b.setAttribute('aria-label', 'How to play ' + noteName(m));
    b.addEventListener('click', () => openNote(m));
    chipsEl.appendChild(b);
  }
}
function addNote(m) {
  if (heard.has(m)) return;
  heard.add(m); newestChip = m; renderChips(); saveHeard();
  setTimeout(() => { if (newestChip === m) { newestChip = -1; renderChips(); } }, 1500);
}
// all pitches in this slice, minus overtones of lower notes, kept only if they last about half a second
function noteStep(peaks) {
  const cand = peaks.filter(p => p.r >= 36 && p.r <= 84).sort((a, b) => b.b - a.b);
  const next = new Map();
  if (cand.length) {
    const top = cand[0].b, keep = [];
    for (const p of cand) {
      if (p.b < top - 22 || keep.length >= 6) break;
      let overtone = false;
      for (let d = 2; d <= 6 && !overtone; d++) {
        const rm = Math.round(69 + 12 * Math.log2(p.f / d / 440));
        if (cand.some(q => q !== p && q.r === rm && q.b >= p.b - 15)) overtone = true;
      }
      if (!overtone) keep.push(p.r);
    }
    for (const m of keep) { const c = (noteStreak.get(m) || 0) + 1; next.set(m, c); if (c >= 2) addNote(m); }
  }
  noteStreak = next;
}
document.getElementById('clearNotes').addEventListener('click', () => { heard.clear(); newestChip = -1; renderChips(); saveHeard(); });
try { const saved = JSON.parse(localStorage.getItem(NOTES_STORE) || '[]'); if (Array.isArray(saved)) saved.forEach(m => { if (Number.isInteger(m) && m >= 12 && m <= 120) heard.add(m); }); } catch (e) {}
renderChips();

// how to find each note on a piano, using the black-key landmarks
const FIND = {
  0: 'White key just left of a group of 2 black keys.',
  1: 'Black key: the left one of the group of 2.',
  2: 'White key between the 2 black keys of the pair.',
  3: 'Black key: the right one of the group of 2.',
  4: 'White key just right of the group of 2 black keys.',
  5: 'White key just left of a group of 3 black keys.',
  6: 'Black key: the left one of the group of 3.',
  7: 'White key between the first and second black keys of the group of 3.',
  8: 'Black key: the middle one of the group of 3.',
  9: 'White key between the second and third black keys of the group of 3.',
  10: 'Black key: the right one of the group of 3.',
  11: 'White key just right of the group of 3 black keys.'
};
function drawModalKeys(m) {
  const svg = document.getElementById('mkb'); svg.textContent = '';
  const oct = Math.floor(m / 12), pc = m % 12;
  const lo = (pc >= 6 ? oct - 1 : oct) * 12, hi = lo + 24;     // two octaves, with the note placed so there is room on both sides
  const W = 28, TOP = 18, blacks = []; let wi = 0;
  for (let n = lo; n <= hi; n++) {
    const p = n % 12;
    if (WHITE_PC.includes(p)) {
      const x = wi * W, on = n === m;
      svg.appendChild(svgEl('rect', { x, y: TOP, width: W, height: 96, rx: 3, class: 'wk' + (on ? ' rt' : '') }));
      if (p === 0 || on) svg.appendChild(svgEl('text', { x: x + W / 2, y: TOP + 88, class: 'nt', style: on ? 'font-size:12px;font-weight:800' : '' }, noteName(n)));
      if (n === 60) svg.appendChild(svgEl('text', { x: x + 2, y: 11, class: 'fg', style: 'fill:#98a2b1;font-size:10px;font-weight:600;text-anchor:start' }, 'middle C'));
      wi++;
    } else blacks.push({ n, x: wi * W });
  }
  for (const b of blacks) {
    const on = b.n === m;
    svg.appendChild(svgEl('rect', { x: b.x - 9, y: TOP, width: 18, height: 60, rx: 2, class: 'bk' + (on ? ' rt' : '') }));
    if (on) svg.appendChild(svgEl('text', { x: b.x, y: TOP + 50, class: 'nt on-black', style: 'font-size:10px;font-weight:800' }, noteName(b.n)));
  }
  svg.setAttribute('viewBox', '0 0 ' + (wi * W) + ' 118');
}
let modalOpener = null, playCtx = null;
function openNote(m) {
  const name = noteName(m), pc = m % 12, oct = Math.floor(m / 12) - 1;
  document.getElementById('mtitle').textContent = name;
  const octDiff = oct - 4;
  document.getElementById('msub').textContent = Math.round(noteHz(m)) + ' Hz · ' + (octDiff === 0 ? 'the octave starting at middle C' : Math.abs(octDiff) + (Math.abs(octDiff) === 1 ? ' octave ' : ' octaves ') + (octDiff > 0 ? 'above' : 'below') + ' middle C');
  drawModalKeys(m);
  const how = document.getElementById('mhow'); how.textContent = '';
  const add = (t) => { const p = document.createElement('p'); p.textContent = t; how.appendChild(p); };
  add(FIND[pc]);
  add((m >= 60 ? 'Usually played with the right hand' : 'Usually played with the left hand') + ' (middle C and above go to the right). Any finger works for a single note; keep the others relaxed above the keys.');
  add('The amber key above is ' + name + '. Every ' + NOTES[pc] + ' on the piano is the same note in a different octave.');
  modalOpener = document.activeElement;
  document.getElementById('modal').hidden = false;
  document.getElementById('mclose').focus();
  document.getElementById('mplay').onclick = () => playNote(m);
}
function closeNote() { document.getElementById('modal').hidden = true; if (modalOpener && modalOpener.focus) modalOpener.focus(); }
function playNote(m) {
  try {
    if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (playCtx.state === 'suspended') playCtx.resume();
    const o = playCtx.createOscillator(), g = playCtx.createGain(), t = playCtx.currentTime;
    o.type = 'triangle'; o.frequency.value = noteHz(m);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(g); g.connect(playCtx.destination); o.start(t); o.stop(t + 1.7);
  } catch (e) {}
}
document.getElementById('mclose').addEventListener('click', closeNote);
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeNote(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.getElementById('modal').hidden) closeNote(); });

// visual metronome pulse at the detected tempo
let pulseTimer = null;
function flash(periodSec) {
  clearInterval(pulseTimer);
  pulseTimer = setInterval(() => {
    pulse.classList.add('on');
    setTimeout(() => pulse.classList.remove('on'), 90);
  }, periodSec * 1000);
}

function draw() {
  const w = scope.width, h = scope.height;
  sctx.clearRect(0, 0, w, h);
  sctx.strokeStyle = '#3ddc97'; sctx.lineWidth = 2; sctx.beginPath();
  const n = envVals.length;
  let max = 0.001; for (const v of envVals) if (v > max) max = v;
  for (let i = 0; i < n; i++) {
    const x = (i / Math.max(n-1,1)) * w;
    const y = h - (envVals[i] / max) * (h - 10) - 5;
    i ? sctx.lineTo(x, y) : sctx.moveTo(x, y);
  }
  sctx.stroke();
}
try { renderScale(-1); } catch (e) { diagExtra = ' · keyboard error: ' + e.message; }
window.addEventListener('error', (e) => { diagExtra = ' · error: ' + e.message; });
</script>
